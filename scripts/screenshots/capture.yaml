appId: org.languagetransfer
---
- launchApp:
    clearState: true
- assertVisible: "(?i)Language courses"
- takeScreenshot: "${SCREENSHOT_DIR}/01-courses"
- scrollUntilVisible:
    element:
      text: "(?i)(complete )?Spanish(, .* lessons)?"
    direction: DOWN
- tapOn: "(?i)(complete )?Spanish(, .* lessons)?"
- extendedWaitUntil:
    visible: "(?s).*\\bLesson 1\\b.*"
    timeout: 60000
- takeScreenshot: "${SCREENSHOT_DIR}/02-spanish"
- tapOn: "All Lessons.*"
- assertVisible: ".*Download All.*"
- takeScreenshot: "${SCREENSHOT_DIR}/03-lessons"
- tapOn: "(?s).*\\bLesson 1\\b.*"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 60000
- tapOn: "Pause"
- assertVisible: "Play"
- takeScreenshot: "${SCREENSHOT_DIR}/04-player"
