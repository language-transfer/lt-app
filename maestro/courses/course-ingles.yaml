appId: org.languagetransfer
---
- launchApp:
    clearState: true
- assertVisible: "Language courses"
- scrollUntilVisible:
    element:
      text: "Inglés"
    direction: DOWN
- assertVisible: "complete Inglés, 51 lessons"
- tapOn: "Inglés"
- assertVisible: "Introducción"
- assertVisible: "¿Buscas el curso anterior? La Introducción a Inglés sigue disponible."
- assertVisible: "Introducción a Inglés — curso anterior"
- takeScreenshot: course-ingles-complete
