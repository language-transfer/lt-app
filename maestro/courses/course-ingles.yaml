appId: org.languagetransfer
---
- launchApp:
    clearState: true
- assertVisible: "Language courses"
- scrollUntilVisible:
    element:
      text: "Inglés"
    direction: DOWN
- assertVisible: "complete Inglés, 51 lessons"
- tapOn: "Inglés"
- assertVisible: "Introducción"
- assertVisible: "¡Nuevo curso!"
- assertVisible: "¡'Inglés Completo' ya se está lanzando!"
- assertVisible: "Empieza desde el principio de este nuevo curso"
- assertNotVisible: "Abrir curso anterior"
- assertNotVisible: "Introducción a Inglés — curso anterior"
- takeScreenshot: course-ingles-complete
- tapOn: "All Lessons"
- scrollUntilVisible:
    element:
      text: "El curso antiguo se encuentra en el canal de YouTube de Language Transfer."
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 100
- assertVisible: "El curso antiguo se encuentra en el canal de YouTube de Language Transfer."
- takeScreenshot: course-ingles-lessons-footer
